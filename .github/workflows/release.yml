on:
  push:
    tags:
      - '*'

name: Release

jobs:
  build-ubuntu-x86_64:
    name: Ubuntu (x86_64)
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl-dev libglu1-mesa-dev libgtk-3-dev libjack-dev libmad0-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev nasm
      - name: Create full release
        if: "!contains(github.ref_name, '-beta')"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=On
      - name: Create package
        id: package
        run: cmake --build build --target package
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: StepMania-${{ github.sha }}-Ubuntu (x86_64)
          path: build/StepMania-*.tar.gz
          archive: false
      - uses: actions/attest@v4
        with:
          subject-name: StepMania-${{ github.sha }}-Ubuntu (x86_64)
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

  build-ubuntu-arm:
    name: Ubuntu (ARM)
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl-dev libglu1-mesa-dev libgtk-3-dev libjack-dev libmad0-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev nasm
      - name: Create full release
        if: "!contains(github.ref_name, '-beta')"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=On -DWITH_NIGHTLY_RELEASE=Off -DWITH_CLUB_FANTASTIC=Off
      - name: Create package
        id: package
        run: cmake --build build --target package
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: StepMania-${{ github.sha }}-Ubuntu (ARM)
          path: build/StepMania-*.tar.gz
          archive: false
      - uses: actions/attest@v4
        with:
          subject-name: StepMania-${{ github.sha }}-Ubuntu (ARM)
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

  build-macos-arm:
    name: macOS (arm64)
    runs-on: macos-15
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install nasm
      - name: Create full release
        if: "!contains(github.ref_name, '-beta')"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=On -DWITH_NIGHTLY_RELEASE=Off -DCMAKE_OSX_ARCHITECTURES=arm64
      - name: Create package
        id: package
        run: cmake --build build --target package
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: StepMania-${{ github.sha }}-macOS (arm64)
          path: build/StepMania-*.dmg
          archive: false
      - uses: actions/attest@v4
        with:
          subject-name: StepMania-${{ github.sha }}-macOS (arm64)
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

  build-macos-intel:
    name: macOS (x86_64)
    runs-on: macos-15-intel
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install nasm
      - name: Create full release
        if: "!contains(github.ref_name, '-beta')"
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=On -DWITH_NIGHTLY_RELEASE=Off -DCMAKE_OSX_ARCHITECTURES=x86_64
      - name: Create package
        id: package
        run: cmake --build build --target package
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: StepMania-${{ github.sha }}-macOS (Intel)
          path: build/StepMania-*-NIGHTLY-git-*-macOS-Intel-no-songs.dmg
          archive: false
      - uses: actions/attest@v4
        with:
          subject-name: StepMania-${{ github.sha }}-macOS (Intel)
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

  build-windows:
    name: Windows
    runs-on: windows-2022
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Create full release
        if: "!contains(github.ref_name, '-beta')"
        run: cmake -B build -DWITH_FFMPEG_JOBS="$env:NUMBER_OF_PROCESSORS" -DWITH_FULL_RELEASE=On -DWITH_NIGHTLY_RELEASE=Off
      - name: Create package
        id: package
        run: cmake --build build --config Release --target package
      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: StepMania-${{ github.sha }}-Windows
          path: build/StepMania-*.exe
          archive: false
      - uses: actions/attest@v4
        with:
          subject-name: StepMania-${{ github.sha }}-Windows
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}